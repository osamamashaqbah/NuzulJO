name: Keep backend warm

# Render's free tier spins the web service down after ~15 minutes of inactivity; the next
# real visitor then pays a ~50s cold start. Pinging /api/health on a shorter interval keeps
# it warm so real users don't see that delay. Free (GitHub Actions), no card required.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf https://nuzuljo-api.onrender.com/api/health
