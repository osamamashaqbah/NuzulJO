services:
  - type: web
    name: nuzuljo-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production (set below) makes plain `npm install` skip
    # devDependencies, but typescript/@types/node/prisma CLI are devDeps needed to build at all.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nuzuljo-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: "NuzulJO <no-reply@nuzuljo.local>"

databases:
  - name: nuzuljo-db
    plan: free
    databaseName: nuzuljo
    user: nuzuljo
